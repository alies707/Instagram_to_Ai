services:
  api:
    image: python:3.12
    working_dir: /app
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  redis:
    image: redis:latest

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: instagram_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
